<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ekamatra AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e293b; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; color: #38bdf8; }
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user { background: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .input-container { padding: 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
        input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        button:active { background: #0369a1; }
    </style>
</head>
<body>

    <header>🤖 Ekamatra AI</header>

    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Tanyakan sesuatu..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">Sedang berpikir...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg bot">⚠️ Respon tidak valid.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="msg bot">❌ Error terhubung ke API.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
