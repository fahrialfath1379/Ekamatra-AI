<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ekamatra AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #000000; /* Hitam Pekat Murni */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            height: 100vh;
        }

        /* HEADER DENGAN LOGO KRISTAL EKAMATRA */
        header {
            background: #0a0a0a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #1f1f1f;
            color: #0088ff; /* Cyber Blue Ekamatra */
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* PERBAIKAN LOGO: Menyatu dengan Latar Gelap (Menghilangkan Latar Putih) */
        header img.brand-logo {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 50%;
            mix-blend-mode: screen; /* Trik CSS agar latar putih logo menyatu dengan warna hitam */
            filter: contrast(110%);
        }

        /* PERBAIKAN AREA CHAT BOX */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #000000;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Pesan Pengguna (User) */
        .user {
            background: #0088ff;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 2px 8px rgba(0, 136, 255, 0.3);
        }

        /* Pesan AI (Ekamatra) */
        .bot {
            background: #121212;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #222222;
        }

        /* PERBAIKAN KOTAK INPUT (Terlihat Jelas di Bagian Bawah) */
        .input-container {
            padding: 12px 16px;
            background: #0a0a0a;
            border-top: 1px solid #222222; /* Border pemisah yang tegas */
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333333;
            background: #121212;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: #0088ff;
            box-shadow: 0 0 8px rgba(0, 136, 255, 0.4);
        }

        button {
            padding: 0 20px;
            background: #0088ff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:active {
            background: #0066cc;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <img src="AddText_06-14-06.26.01.jpg" alt="Ekamatra Logo" class="brand-logo">
            <span>Ekamatra AI</span>
        </header>

        <div id="chat-box">
            <div class="msg bot">Salam. Saya Ekamatra AI. Ada yang bisa saya bantu?</div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Tanyakan sesuatu..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">Sedang berpikir...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg bot">⚠️ Respon tidak valid.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="msg bot">❌ Error terhubung ke API.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
