<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Ekamatra</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
        .chat-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 10px; }
        #chat-box { height: 350px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #0a0a0a; }
        .msg { margin: 8px 0; padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #007bff; margin-left: auto; text-align: right; }
        .bot { background: #2a2a2a; color: #e0e0e0; }
        .input-box { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        button { padding: 12px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>🤖 Ekamatra AI</h2>
        <div id="chat-box"></div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">Sedang mengetik...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg bot">⚠️ Respon tidak valid dari API.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="msg bot">❌ Error: Gagal terhubung ke API Groq.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
